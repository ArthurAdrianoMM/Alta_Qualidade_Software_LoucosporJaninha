[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-petrobahia"
version = "0.1.0"
description = "Ferramentas e scripts legados da PetroBahia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["legacy"]
src_paths = ["src", "tests"]
combine_as_imports = true

[tool.pytest.ini_options]
addopts = "-ra --maxfail=1"
testpaths = ["tests"]


